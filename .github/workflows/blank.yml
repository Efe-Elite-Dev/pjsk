name: Auto-Build PJSK RMSKIN

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repo Kopyala
      uses: actions/checkout@v4

    - name: PJSK Dosyalarini RMSKIN Formatinda Paketle
      run: |
        $source = "$env:GITHUB_WORKSPACE\PJSK_Source"
        $output = "$env:GITHUB_WORKSPACE\PJSK_Ultimate_Player.rmskin"

        Write-Host "Klasor zip/rmskin olarak arsivleniyor..."
        Compress-Archive -Path "$source\*" -DestinationPath $output -Force

        if (Test-Path $output) {
            Write-Host "RMSKIN basariyla olusturuldu!"
        } else {
            Write-Error "Paketleme basarisiz oldu!"
            exit 1
        }

    - name: RMSKIN Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: PJSK-Ultimate-Player-RMSKIN
        path: PJSK_Ultimate_Player.rmskin
