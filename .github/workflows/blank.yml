name: Build PJSK Pure Folder

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repo Kopyala
      uses: actions/checkout@v4

    - name: PJSK_Custom Klasorunu Arsivle
      run: |
        $workspace = "$env:GITHUB_WORKSPACE"
        $targetDir = "$workspace\PJSK_Custom"
        
        # Eğer dosyalar ana dizindeyse PJSK_Custom klasöründe topla
        if (-not (Test-Path $targetDir)) {
            New-Item -ItemType Directory -Force -Path $targetDir
            Get-ChildItem -Path $workspace -Exclude ".github", "PJSK_Custom", "*.zip" | Move-Item -Destination $targetDir -Force
        }
        
        $output = "$workspace\PJSK_Custom.zip"
        Compress-Archive -Path $targetDir -DestinationPath $output -Force

    - name: Zipli Paketi Yukle
      uses: actions/upload-artifact@v4
      with:
        name: PJSK-Custom-Folder
        path: PJSK_Custom.zip
