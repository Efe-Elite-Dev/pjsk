[Rainmeter]
Update=1000
Author=Feyzula Efe & Miku

[Metadata]
Name=PJSK_Ultimate_Player
Description=Project Sekai Logo, Saat, Muzik Calar ve Kapatma Butonu
Version=11.0

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSound]
Measure=Plugin
Plugin=Sound
SoundFile=#@#flyway.mp3
Volume=100

[MeterBackground]
Meter=Image
W=380
H=280
SolidColor=10,10,20,245
X=0
Y=0

[MeterBorder]
Meter=Image
W=380
H=3
SolidColor=0,240,255,255
X=0
Y=0

; --- SAĞ ÜST ÇARPI (X) İLE KAPATMA ---
[MeterCloseBtn]
Meter=String
Text="✕"
FontColor=255,0,127,255
FontSize=14
StringStyle=Bold
AntiAlias=1
X=350
Y=8
LeftMouseUpAction=[!DeactivateConfig]

; --- LOGO (Üst Kısım - @Resources'tan çeker) ---
[MeterLogo]
Meter=Image
ImageName=#@#logo.png
W=310
H=95
X=20
Y=15
AntiAlias=1

; --- SAAT ---
[MeterTimeText]
Meter=String
MeasureName=MeasureTime
FontColor=0,240,255,255
FontFace=Segoe UI Light
FontSize=20
StringStyle=Bold
AntiAlias=1
X=20
Y=115

; --- ŞARKI BİLGİSİ ---
[MeterTitle]
Meter=String
Text="Flyway - Leo/need x Len"
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=10
StringStyle=Bold
AntiAlias=1
X=20
Y=160

; --- KONTROL BUTONLARI ---
[MeterPrev]
Meter=String
Text="⏮ Geri"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=20
Y=195
LeftMouseUpAction=[!CommandMeasure MeasureSound "Stop"]

[MeterPlay]
Meter=String
Text="▶ Başlat"
FontColor=0,240,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=100
Y=195
LeftMouseUpAction=[!CommandMeasure MeasureSound "Play"]

[MeterPause]
Meter=String
Text="⏸ Durdur"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=195
Y=195
LeftMouseUpAction=[!CommandMeasure MeasureSound "Stop"]

[MeterNext]
Meter=String
Text="İleri ⏭"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=290
Y=195
LeftMouseUpAction=[!CommandMeasure MeasureSound "Play"]

; --- SES KONTROLÜ ---
[MeterVolDown]
Meter=String
Text="🔊 [- Ses]"
FontColor=255,0,127,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=45
Y=235
LeftMouseUpAction=[!CommandMeasure MeasureSound "SetVolume -10"]

[MeterVolUp]
Meter=String
Text="[+ Ses] 🔊"
FontColor=0,240,255,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=245
Y=235
LeftMouseUpAction=[!CommandMeasure MeasureSound "SetVolume +10"]
