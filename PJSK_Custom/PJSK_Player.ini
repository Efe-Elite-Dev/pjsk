[Rainmeter]
Update=1000
Author=Feyzula Efe & Miku

[Metadata]
Name=PJSK_GitHub_Player
Description=Project Sekai Logo ve Flyway Muzik Oynatici
Version=8.0

[MeasureSound]
Measure=Plugin
Plugin=Sound
SoundFile=flyway.mp3
Volume=100

[MeterBackground]
Meter=Image
W=340
H=230
SolidColor=10,10,20,230
X=0
Y=0

[MeterBorder]
Meter=Image
W=340
H=3
SolidColor=0,240,255,255
X=0
Y=0

; --- LOGO (Ust Kisim) ---
[MeterLogo]
Meter=Image
ImageName=logo.png
W=300
H=90
X=20
Y=10
AntiAlias=1

; --- BILGI ---
[MeterTitle]
Meter=String
Text="Flyway [Project Sekai]"
FontColor=0,240,255,255
FontFace=Segoe UI
FontSize=11
StringStyle=Bold
AntiAlias=1
X=20
Y=128

; --- KONTROL BUTONLARI ---
[MeterPlay]
Meter=String
Text="▶ Baslat"
FontColor=0,240,255,255
FontSize=12
StringStyle=Bold
AntiAlias=1
X=40
Y=165
LeftMouseUpAction=[!CommandMeasure MeasureSound "Play"]

[MeterPause]
Meter=String
Text="⏸ Durdur"
FontColor=255,255,255,255
FontSize=12
StringStyle=Bold
AntiAlias=1
X=130
Y=165
LeftMouseUpAction=[!CommandMeasure MeasureSound "Stop"]
