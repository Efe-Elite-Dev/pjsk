name: Auto-Build PJSK Package

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repo Kopyala
      uses: actions/checkout@v4

    - name: PJSK Klasor Yapisi Olustur ve Ziple
      run: |
        $workspace = "$env:GITHUB_WORKSPACE"
        $targetDir = "$workspace\PJSK_Custom"
        
        # Klasör yoksa oluştur ve gerekli dosyaları içine taşı
        New-Item -ItemType Directory -Force -Path $targetDir
        
        Get-ChildItem -Path $workspace -Exclude ".github", "PJSK_Custom", "*.zip" | Move-Item -Destination $targetDir -Force
        
        # Zip olarak arşivle
        $output = "$workspace\PJSK_Project_Sekai_Player.zip"
        Compress-Archive -Path $targetDir -DestinationPath $output -Force
        
        Write-Host "Paket hazir!"

    - name: Paketi Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: PJSK-Project-Sekai-Player
        path: PJSK_Project_Sekai_Player.zip
