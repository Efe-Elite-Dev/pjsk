[Rainmeter]
Update=1000
Author=Feyzula Efe & Miku

[Metadata]
Name=PJSK_Ultimate_Player
Description=Project Sekai Logo ve Flyway Müzik Kontrol Paneli
Version=6.0

[MeasureMusic]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=FILE
PlayerPath=#CURRENTPATH#flyway.mp3
PlayerName=WMP

[MeterBackground]
Meter=Image
W=340
H=230
SolidColor=10,10,20,230
X=0
Y=0

[MeterBorder]
Meter=Image
W=340
H=3
SolidColor=0,240,255,255
X=0
Y=0

; --- LOGO (En Üst Kısım) ---
[MeterLogo]
Meter=Image
ImageName=logo.png
W=300
H=90
X=20
Y=10
AntiAlias=1

; --- ŞARKI BİLGİSİ ---
[MeterArtist]
Meter=String
Text="Leo/need x Kagamine Len"
FontColor=255,0,127,255
FontFace=Segoe UI Bold
FontSize=10
AntiAlias=1
X=20
Y=110

[MeterTitle]
Meter=String
Text="Flyway [PJSK]"
FontColor=0,240,255,255
FontFace=Segoe UI
FontSize=11
StringStyle=Bold
AntiAlias=1
X=20
Y=128

; --- KONTROL DÜĞMELERİ (Başlat, Durdur, Kapat) ---
[MeterPlay]
Meter=String
Text="▶ Başlat"
FontColor=0,240,255,255
FontSize=12
StringStyle=Bold
AntiAlias=1
X=30
Y=165
LeftMouseUpAction=[!CommandMeasure MeasureMusic "Play"]

[MeterPause]
Meter=String
Text="⏸ Durdur"
FontColor=255,255,255,255
FontSize=12
StringStyle=Bold
AntiAlias=1
X=120
Y=165
LeftMouseUpAction=[!CommandMeasure MeasureMusic "Pause"]

[MeterStop]
Meter=String
Text="⏹ Kapat"
FontColor=255,0,127,255
FontSize=12
StringStyle=Bold
AntiAlias=1
X=215
Y=165
LeftMouseUpAction=[!CommandMeasure MeasureMusic "Stop"]

; --- EKSTRA SES KONTROLÜ ---
[MeterVolDown]
Meter=String
Text="🔊 [- Ses]"
FontColor=255,0,127,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=40
Y=200
LeftMouseUpAction=[!CommandMeasure MeasureMusic "SetVolume -10"]

[MeterVolUp]
Meter=String
Text="[+ Ses] 🔊"
FontColor=0,240,255,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=220
Y=200
LeftMouseUpAction=[!CommandMeasure MeasureMusic "SetVolume +10"]
