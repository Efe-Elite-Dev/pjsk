name: Build Direct RMSKIN

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repo Kopyala
      uses: actions/checkout@v4

    - name: Dosyalari RMSKIN Olarak Paketle
      run: |
        $workspace = "$env:GITHUB_WORKSPACE"
        $targetDir = "$workspace\PJSK_Custom"
        
        # Eğer dosyalar ana dizindeyse PJSK_Custom klasöründe topla
        if (-not (Test-Path $targetDir)) {
            New-Item -ItemType Directory -Force -Path $targetDir
            Get-ChildItem -Path $workspace -Exclude ".github", "PJSK_Custom", "*.rmskin" | Move-Item -Destination $targetDir -Force
        }
        
        # Doğrudan .rmskin uzantılı arşiv oluştur
        $output = "$workspace\PJSK_Ultimate_Player.rmskin"
        Compress-Archive -Path $targetDir -DestinationPath $output -Force
        
        Write-Host "RMSKIN dosyasi basariyla olusturuldu!"

    - name: RMSKIN Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: PJSK-Ultimate-Player-RMSKIN
        path: PJSK_Ultimate_Player.rmskin
