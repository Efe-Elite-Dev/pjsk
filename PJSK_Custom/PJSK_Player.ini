[Rainmeter]
Update=1000
Author=Feyzula Efe & Miku

[Metadata]
Name=PJSK_Ultimate_Widget
Description=Project Sekai Logo, Saat, Muzik Kontrol ve Kapatma Butonu
Version=9.0

; --- SAAT ÖLÇÜCÜ ---
[MeasureTime]
Measure=Time
Format=%H:%M

; --- SES / MÜZİK ÖLÇÜCÜ ---
[MeasureSound]
Measure=Plugin
Plugin=Sound
SoundFile=flyway.mp3
Volume=100

; --- GÖRSEL ARKA PLAN ---
[MeterBackground]
Meter=Image
W=360
H=260
SolidColor=10,10,20,240
X=0
Y=0

[MeterBorder]
Meter=Image
W=360
H=3
SolidColor=0,240,255,255
X=0
Y=0

; --- SAĞ ÜST ÇARPI (X) KAPATMA BUTONU ---
[MeterCloseBtn]
Meter=String
Text="✕"
FontColor=255,0,127,255
FontSize=14
StringStyle=Bold
AntiAlias=1
X=335
Y=8
LeftMouseUpAction=[!DeactivateConfig]

; --- LOGO (Üst Kısım) ---
[MeterLogo]
Meter=Image
ImageName=logo.png
W=280
H=85
X=20
Y=15
AntiAlias=1

; --- SAAT GÖSTERGESİ ---
[MeterTimeText]
Meter=String
MeasureName=MeasureTime
FontColor=0,240,255,255
FontFace=Segoe UI Light
FontSize=18
StringStyle=Bold
AntiAlias=1
X=20
Y=105

; --- ŞARKI BİLGİSİ ---
[MeterTitle]
Meter=String
Text="Flyway - Leo/need x Len"
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=10
StringStyle=Bold
AntiAlias=1
X=20
Y=145

; --- MÜZİK KONTROL BUTONLARI (İleri, Geri, Durdur, Başlat) ---
[MeterPrev]
Meter=String
Text="⏮ Geri"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=20
Y=180
LeftMouseUpAction=[!CommandMeasure MeasureSound "Stop"]

[MeterPlay]
Meter=String
Text="▶ Başlat"
FontColor=0,240,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=95
Y=180
LeftMouseUpAction=[!CommandMeasure MeasureSound "Play"]

[MeterPause]
Meter=String
Text="⏸ Durdur"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=185
Y=180
LeftMouseUpAction=[!CommandMeasure MeasureSound "Stop"]

[MeterNext]
Meter=String
Text="İleri ⏭"
FontColor=255,255,255,255
FontSize=11
StringStyle=Bold
AntiAlias=1
X=275
Y=180
LeftMouseUpAction=[!CommandMeasure MeasureSound "Play"]

; --- EKSTRA SES KONTROLÜ ---
[MeterVolDown]
Meter=String
Text="🔊 [- Ses]"
FontColor=255,0,127,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=40
Y=220
LeftMouseUpAction=[!CommandMeasure MeasureSound "SetVolume -10"]

[MeterVolUp]
Meter=String
Text="[+ Ses] 🔊"
FontColor=0,240,255,255
FontSize=10
StringStyle=Bold
AntiAlias=1
X=230
Y=220
LeftMouseUpAction=[!CommandMeasure MeasureSound "SetVolume +10"]
